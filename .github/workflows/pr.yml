name: PR Checks
on:
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  lockfile:
    # `uv lock --check` re-resolves and exits non-zero if uv.lock is stale or
    # contradicts pyproject.toml. Its own job, not a step in `test`: it needs
    # neither the dev extras nor a compiler, runs in seconds, and reports a
    # dependency-metadata problem as a distinct failure rather than one buried
    # in a build log.
    #
    # This is the gate that would have caught the `requires-python = ">=3.10"`
    # against `numpy>=2.4.6` contradiction (#126) on the first PR that
    # introduced it -- that combination has no solution, so the resolve fails
    # outright -- instead of some weeks later.
    #
    # NOTE: the lockfile is gated here but deliberately NOT consumed by `test`
    # below, which still installs with `pip install .[dev]`. That inconsistency
    # is the intended design, so please do not "fix" it by switching `test` to
    # `uv sync --locked`. For a library, the unlocked install is what catches "a
    # new numpy release breaks us"; pinning CI would trade that signal away. The
    # lock exists to keep the *developer* environment reproducible and to keep
    # the working tree clean for repos that vendor this one as a pinned
    # submodule (#131) -- not to pin CI.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1

      - name: Verify uv.lock is in sync with pyproject.toml
        run: uv lock --check

  wheel:
    # Guards the fix for #132. The `test` job below builds with
    # `setup.py build_ext --inplace`, which is the *developer* path -- it proves
    # the kernels compile, but it says nothing about whether an installed copy
    # gets them. For a long time it did not: hatchling had no build hook, so
    # every wheel was py3-none-any and HAS_CYTHON was False for every user while
    # CI stayed green.
    #
    # So this job deliberately never touches the source tree: it builds a wheel,
    # installs it into a clean venv, and asserts from a directory where `src/`
    # cannot shadow the package. That is the only arrangement that can tell
    # "the kernels compile" apart from "the kernels ship".
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'

      - name: Build a wheel with the kernels required
        # `python -m build`, NOT `pipx run build`: the wheel is now
        # interpreter-specific, and pipx runs `build` under its own Python
        # (3.12 on the runner) regardless of setup-python. That produced a
        # cp312 wheel the 3.14 venv below then refused with "not a supported
        # wheel on this platform".
        #
        # OPTIMIZERS_REQUIRE_CYTHON makes the hook fatal instead of degrading to
        # a pure-Python wheel, which is correct for a source install but would
        # let exactly the #132 regression through this gate unnoticed.
        env:
          OPTIMIZERS_REQUIRE_CYTHON: '1'
        run: |
          python -m pip install --upgrade build
          python -m build --wheel

      - name: The wheel must be platform-tagged, not py3-none-any
        run: |
          set -euo pipefail
          wheel=$(ls dist/*.whl)
          echo "built: $wheel"
          case "$wheel" in
            *py3-none-any.whl)
              echo "::error::$wheel is a pure-Python wheel -- the build hook did not run (#132)"
              exit 1
              ;;
          esac

      - name: Install the wheel and confirm HAS_CYTHON is True
        # Run from /tmp: at the repo root `src/` is not on sys.path, but keeping
        # the assertion away from the checkout entirely removes any doubt about
        # what got imported.
        run: |
          set -euo pipefail
          python -m venv /tmp/wheel-check
          /tmp/wheel-check/bin/pip install --quiet dist/*.whl
          cd /tmp
          /tmp/wheel-check/bin/python -c "
          from optimizers.combinatorial.strategy import HAS_CYTHON as tsp
          from optimizers.benchmarks.cython_kernels import HAS_CYTHON as bench
          assert tsp and bench, f'installed wheel has no kernels: tsp={tsp} bench={bench}'
          print('installed wheel exposes both compiled kernels')
          "

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install .[dev]

      - name: Install build dependencies for Cython
        run: |
          pip install "setuptools>=42" wheel "Cython>=3.0"

      - name: Build compiled extensions in place
        # so the src-layout tests (PYTHONPATH=./src) import the compiled
        # _tsp_cython kernels rather than skipping them. setuptools is no longer
        # bundled with Python >=3.12, and pip's build isolation for the step
        # above doesn't leave the build deps importable, so install them here.
        run: python setup.py build_ext --inplace

      - name: Confirm the compiled kernels actually built
        # Guards the `build_ext` step directly above, not the `pip install`
        # further up -- the build backend is hatchling, so an install ships a
        # pure-Python wheel and compiles nothing. Both extensions are declared
        # `optional=True`, and that flag is now actually effective, so a compile
        # failure is a warning and `build_ext` still exits 0. That is deliberate:
        # a source tree without a usable toolchain should fall back to the numba
        # / pure-NumPy kernels rather than hard-fail. CI must not accept the
        # fallback silently, though, or a broken kernel reads as a green build
        # hiding a large performance regression.
        run: PYTHONPATH=./src python -c "import optimizers.combinatorial._tsp_cython, optimizers.benchmarks._bench_cython; print('compiled kernels present')"

      - name: Check code formatting with black
        run: black --check .

      - name: Lint with flake8
        run: flake8 ./src ./tests

      - name: Type-check with mypy
        run: MYPYPATH=src mypy -p optimizers

      - name: Run tests (skipping long-running performance tests)
        # --fast caps optimizer workloads (generations/population) so the
        # pipeline finishes in a reasonable timeline; correctness assertions
        # still run in full. Drop the flag to run the full-fidelity workloads.
        run: PYTHONPATH=./src pytest tests/ --fast
