name: PR Checks
on:
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install .[dev]

      - name: Install build dependencies for Cython
        run: |
          pip install "setuptools>=42" wheel "Cython>=3.0"

      - name: Build compiled extensions in place
        # so the src-layout tests (PYTHONPATH=./src) import the compiled
        # _tsp_cython kernels rather than skipping them. setuptools is no longer
        # bundled with Python >=3.12, and pip's build isolation for the step
        # above doesn't leave the build deps importable, so install them here.
        run: python setup.py build_ext --inplace

      - name: Confirm the compiled kernels actually built
        # Both extensions are declared `optional=True`, and as of this change
        # that flag is finally effective, so a compile failure is a warning and
        # the step above still exits 0. That is the point -- a source install
        # degrades to the numba / pure-NumPy fallbacks rather than hard-failing.
        # CI must not accept that degradation silently, though, or a broken
        # kernel reads as a green build with a quiet performance regression.
        run: PYTHONPATH=./src python -c "import optimizers.combinatorial._tsp_cython, optimizers.benchmarks._bench_cython; print('compiled kernels present')"

      - name: Check code formatting with black
        run: black --check .

      - name: Lint with flake8
        run: flake8 ./src ./tests

      - name: Type-check with mypy
        run: MYPYPATH=src mypy -p optimizers

      - name: Run tests (skipping long-running performance tests)
        # --fast caps optimizer workloads (generations/population) so the
        # pipeline finishes in a reasonable timeline; correctness assertions
        # still run in full. Drop the flag to run the full-fidelity workloads.
        run: PYTHONPATH=./src pytest tests/ --fast
