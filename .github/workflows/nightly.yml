name: Nightly (full-fidelity)

# PR Checks runs `pytest --fast`, which caps generations/population so the
# optimizer workloads finish in a couple of minutes. Correctness assertions
# still run there, but the full-fidelity workloads -- the ones that would catch
# a convergence or quality regression that only shows up at real problem size --
# run nowhere. This is where they run.
#
# Failures open (or comment on) a single tracking issue rather than emailing
# into the void, so a regression that appears at 04:00 is still visible at 09:00.
on:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write

concurrency:
  group: nightly
  cancel-in-progress: true

jobs:
  full-suite:
    runs-on: ubuntu-latest
    # A hung optimizer must not hold a runner for the default six hours.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'
          cache: 'pip'

      - name: Install dependencies
        run: pip install .[dev]

      - name: Install build dependencies for Cython
        run: pip install "setuptools>=42" wheel "Cython>=3.0"

      - name: Build compiled extensions in place
        run: python setup.py build_ext --inplace

      - name: Confirm the compiled kernels actually built
        # Same guard as PR Checks: `optional=True` means a compile failure is a
        # warning and build_ext still exits 0, so a nightly measuring the numba
        # fallback would report a large "regression" that is really a build
        # problem. Fail loudly here instead.
        run: PYTHONPATH=./src python -c "import optimizers.combinatorial._tsp_cython, optimizers.benchmarks._bench_cython; print('compiled kernels present')"

      # No --fast: this is the whole point of the workflow.
      - name: Run the full-fidelity test suite
        run: PYTHONPATH=./src pytest tests/ -v --durations=25

      - name: Report a failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          TITLE="Nightly full-fidelity suite is failing"
          # `gh issue create --label` errors on an unknown label, and a failed
          # report is worse than a noisy one, so ensure the label exists first.
          gh label create nightly-failure --color B60205             --description "Opened automatically when the nightly suite fails" 2>/dev/null || true
          # Exact title match over the labelled issues, NOT `--search "... in:title"`:
          # GitHub's search index lags behind issue creation by seconds to
          # minutes, so a search-based check can miss an issue that already
          # exists and open a duplicate -- the precise failure this dedupe is
          # here to prevent. The label list is served from the database and is
          # immediately consistent.
          existing=$(gh issue list --state open --label nightly-failure --limit 100             --json number,title --jq "map(select(.title == \"$TITLE\")) | .[0].number // empty")
          if [ -n "$existing" ]; then
            # One issue that accumulates nights, not one issue per night.
            gh issue comment "$existing"               --body "Still failing on \`${{ github.sha }}\` -- [run]($RUN_URL)"
            echo "commented on #$existing"
          else
            {
              echo "The nightly full-fidelity run failed. PR Checks runs \`pytest --fast\`, so this is a workload-scale failure the PR gate cannot see."
              echo
              echo "- Commit: \`${{ github.sha }}\`"
              echo "- Run: $RUN_URL"
              echo
              echo "This issue collects one comment per failing night and is NOT closed"
              echo "automatically -- a nightly that starts passing again may just be flaky."
              echo "Close it once the cause is understood."
            } > issue-body.md
            gh issue create --title "$TITLE" --label nightly-failure --body-file issue-body.md
          fi
