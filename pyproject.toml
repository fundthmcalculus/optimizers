[build-system]
# Cython>=3.0 and setuptools are consumed by hatch_build.py, which shells out to
# `setup.py build_ext` to compile the kernels into the wheel. Before that hook
# existed, Cython here was dead weight -- installed into every isolated build
# environment and never imported.
requires = ["hatchling", "setuptools>=42", "Cython>=3.0"]
build-backend = "hatchling.build"

[project]
name = "optimizers"
version = "0.2.0"
description = "A collection of optimization algorithms (GA, PSO, ACO, GD, etc.)"
authors = [{ name = "fundthmcalculus" }]
license = { file = "LICENSE" }
readme = "README.md"
requires-python = ">=3.11,<3.15"
keywords = ["optimization", "GA", "PSO", "ACO", "GD"]
dependencies = [
    "numpy>=2.4.6",
    "matplotlib>=3.10",
    "tqdm>=4.60",
    "joblib>=1.0",
    "kmodes>=0.12.2",
    "scikit-learn>=1.7.2",
    "scipy",
    "pandas>=2.0.0",
    "cloudpickle",
]

[project.optional-dependencies]
# No numba extra: the backend was removed outright once the Cython kernels
# measured faster on every kernel and size. See combinatorial/strategy.py.
dev = [
    "pytest>=6.0",
    "black>=24.0",
    "mypy>=1.8",
    "flake8",
    "Flake8-pyproject",
    "optuna>=4.3.0",
    "Cython>=3.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/optimizers"]

# Compiles the Cython kernels and force-includes them in the wheel. Without it
# hatchling ships py3-none-any and HAS_CYTHON is False in every installed copy
# (#132). Best-effort by default so a source install without a compiler still
# works; OPTIMIZERS_REQUIRE_CYTHON=1 makes a failure fatal, which is what the
# release and CI jobs set.
[tool.hatch.build.targets.wheel.hooks.custom]
path = "hatch_build.py"

# The sdist must carry everything the hook needs to compile on the consumer's
# machine: the .pyx sources come with the package, and setup.py holds the
# compiler-detection logic the hook shells out to.
[tool.hatch.build.targets.sdist]
include = ["src", "setup.py", "hatch_build.py", "README.md", "LICENSE"]

[tool.cibuildwheel]
# requires-python is >=3.11,<3.15, and numpy>=2.4.6 supports >=3.11, so every
# interpreter in that window is buildable.
build = "cp311-* cp312-* cp313-* cp314-*"
# 32-bit legs have no numpy/scipy wheels to test against, and PyPy cannot load
# these CPython-API extensions at all.
#
# musllinux is skipped because `scikit-learn` -- a hard runtime dependency --
# publishes no musl wheels. As of 1.9.0 its platform tags are macosx x86_64 and
# arm64, manylinux x86_64 and aarch64, win_amd64 and win_arm64: no musllinux at
# all. So a musl wheel would build fine here and then be uninstallable.
#
# This was previously attributed to numba/llvmlite, which was also true at the
# time. numba has since been removed entirely, which restored the macOS x86_64
# leg -- but scikit-learn independently blocks musl, so the skip stays.
# Re-checking this means re-checking sklearn.
skip = "*_i686 *-win32 pp* *musllinux*"

# The whole point of #132. Without this the hook degrades to a pure-Python wheel
# on a compile failure, which is correct for a source install but would silently
# reintroduce the exact bug for a release -- and a `py3-none-any` wheel uploaded
# beside real platform wheels would win for some installers.
environment = { OPTIMIZERS_REQUIRE_CYTHON = "1" }

# Import the built wheel from a directory where the source tree cannot shadow
# it, then assert the kernels are actually loadable. `HAS_CYTHON` swallows an
# ImportError by design, so checking the flag -- not merely that the file is in
# the archive -- is what proves the extension imports on a clean machine.
test-command = "python -c \"from optimizers.combinatorial.strategy import HAS_CYTHON as t; from optimizers.benchmarks.cython_kernels import HAS_CYTHON as b; assert t and b, f'wheel has no kernels: tsp={t} bench={b}'; print('kernels present')\""

# Deliberately no [tool.cibuildwheel.linux] before-all installing libgomp: the
# manylinux images already ship a GCC toolchain with it, and auditwheel vendors
# libgomp.so into the wheel during repair, which is what makes the result work
# on a user machine that has no libgomp at all. Installing it at build time
# solves nothing and adds a step that can fail.

[tool.flake8]
max-line-length = 120
exclude = ".git,__pycache__,build,dist,.eggs,.tox,.venv,venv"
include = "./src,./tests"
extend-ignore = ["E203"]
# Complexity ceiling: kept above the current worst offender, _three_opt_kernel
# (bypassed via its own `# noqa: C901` -- an 8-way reconnection switch that
# isn't realistically reducible while mirroring the Cython kernel --
# see combinatorial/strategy.py).
# Guards against regressions elsewhere; ratchet down as complex functions are
# simplified.
max-complexity = 18

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
ignore_missing_imports = true       # joblib / sklearn / kmodes ship no stubs
warn_unused_ignores = true          # ratchet: flags an ignore once its error is fixed
warn_redundant_casts = true
warn_unused_configs = true
show_error_codes = true
# Ratchet 2: stricter definition/return checks. Bodies of untyped functions are
# now checked; every function must be fully annotated; returning Any where a
# concrete type is declared is an error. Numpy-dtype-driven return-Any is
# baselined per-module below (same AF/AI-alias root cause as ratchet 1).
check_untyped_defs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
disallow_untyped_calls = true
disallow_any_generics = true
strict_equality = true
warn_return_any = true
# Ratchet 3: additional strictness. Two options from the initial ratchet are
# dropped: ``warn_unused_variables`` is not a real mypy option (mypy rejects it
# as "Unrecognized option", failing the run under ``warn_unused_configs``), and
# ``warn_unreachable`` fights this codebase's defensive style — it flags the
# ``else: raise`` guards that follow ``ensure_literal_choice`` runtime checks and
# the ``assert`` narrowing guards, plus false positives from the AF/AI dtype
# aliases. The remaining two are kept.
no_implicit_reexport = true
strict_optional = true

# --- No baseline ------------------------------------------------------------
# There are no per-module suppressions. There used to be: nine error codes
# disabled across fourteen modules -- 136 (module, code) pairs in which a new bug
# of that class could land unnoticed -- justified by a comment claiming the AF/AI
# dtype aliases were the cause.
#
# #143 measured that: 110 errors with the whole list removed, of which the
# aliases were 13%. Taking it to zero (#144, #146, #147, #148, #149, #150, #152,
# #153, #154) turned up two crashes, a returned None, a broken feature, a
# silently-ignored config argument and a mis-weighted sampler -- see #145 and
# #151 for the two left open deliberately.
#
# If a new error appears here, fix it. Adding a module back to a suppression list
# is how the previous 136 accumulated.
